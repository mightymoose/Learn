<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn</title>
<meta name="description" content="Lessons and reference cards, searchable.">
<style>
/* Token names match algebra/assets/lesson.css so the index and the pages
   it links look like one site. */
:root {
  --ink: #111008;
  --ink-soft: #4a4740;
  --ink-faint: #6f6b62;
  --paper: #fffef8;
  --card: #fffdf4;
  --rule: #ddd9cc;
  --accent: #7a1c12;
  --accent-soft: #f4ece4;
  --measure: 46rem;
  --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --mono: "SF Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8e4d9;
    --ink-soft: #b3ada0;
    --ink-faint: #8b857a;
    --paper: #16150f;
    --card: #1c1a14;
    --rule: #35322a;
    --accent: #e8907f;
    --accent-soft: #241f1c;
  }
}

* { box-sizing: border-box; }

html { font-size: 17px; }

body {
  margin: 0 auto;
  padding: 4rem 1.5rem 6rem;
  max-width: 54rem;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.kicker {
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 0 0 0.6rem;
}

h1 {
  font-size: 2.4rem;
  font-weight: 400;
  letter-spacing: -0.015em;
  margin: 0 0 0.4rem;
}

.tagline {
  color: var(--ink-soft);
  font-style: italic;
  margin: 0 0 2.4rem;
  max-width: var(--measure);
}

/* ---------- controls ---------- */

.controls { margin-bottom: 1.2rem; }

.search {
  width: 100%;
  font-family: var(--serif);
  font-size: 1.05rem;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 0.7rem 0.9rem;
}
.search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.search::placeholder { color: var(--ink-faint); }

.chips { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.7rem; align-items: center; }

.chip {
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 0.3rem 0.75rem;
  cursor: pointer;
}
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.count {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--ink-faint);
  margin-left: auto;
}

/* ---------- results ---------- */

.subject {
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
  border-bottom: 1px solid var(--rule);
  padding-bottom: 0.4rem;
  margin: 2.4rem 0 1rem;
}

.card {
  display: block;
  border: 1px solid var(--rule);
  border-radius: 5px;
  background: var(--card);
  padding: 1rem 1.15rem;
  margin-bottom: 0.7rem;
  text-decoration: none;
  color: inherit;
  transition: border-color 0.12s ease, transform 0.12s ease;
}
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card-top { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.3rem; }

.card-title { font-size: 1.1rem; }

.badge {
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 0.1rem 0.4rem;
  color: var(--ink-faint);
  white-space: nowrap;
}
.badge.warn { border-color: var(--accent); color: var(--accent); }

.card-summary { color: var(--ink-soft); font-size: 0.95rem; margin: 0.2rem 0 0.5rem; }

.card-meta { font-family: var(--mono); font-size: 0.68rem; color: var(--ink-faint); }

mark { background: var(--accent-soft); color: var(--ink); padding: 0 0.1em; border-radius: 2px; }

.empty {
  border: 1px dashed var(--rule);
  border-radius: 5px;
  padding: 2rem 1.2rem;
  text-align: center;
  color: var(--ink-soft);
  margin-top: 2rem;
}

.foot {
  margin-top: 4rem;
  padding-top: 1.2rem;
  border-top: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--ink-faint);
}
.foot a { color: var(--accent); }

kbd {
  font-family: var(--mono);
  font-size: 0.9em;
  border: 1px solid var(--rule);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 0.05em 0.35em;
}
</style>
</head>
<body>

<p class="kicker">Shelf</p>
<h1>Learn</h1>
<p class="tagline">Lessons and reference cards, built from the books in this repository.
Press <kbd>/</kbd> to search.</p>

<div id="root"></div>

<noscript>
  <p class="empty">This index needs JavaScript. The lessons themselves do not, so you can
  open any page under a subject's <code>lessons/</code> or <code>reference/</code> folder
  directly.</p>
</noscript>

<div class="foot">
  <span id="foot-count"></span>
  Regenerate the index with <code>python3 tools/build-index.py</code>.
</div>

<script src="search-index.js"></script>
<script src="search-filter.js"></script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>

<script>
(function () {
  "use strict";

  var entries = window.LEARN_INDEX || [];
  var root = document.getElementById("root");

  document.getElementById("foot-count").textContent =
    entries.length + (entries.length === 1 ? " page. " : " pages. ");

  /* ---------- fallback: plain list if the CDN or React fails ---------- */

  function renderFallback(reason) {
    var groups = window.groupBySubject
      ? window.groupBySubject(entries)
      : [{ subject: "All", items: entries }];
    var out = "";
    groups.forEach(function (g) {
      out += '<p class="subject">' + g.subject + "</p>";
      g.items.forEach(function (e) {
        out +=
          '<a class="card" href="' + e.path + '">' +
          '<span class="card-top"><span class="card-title">' + e.title + "</span></span>" +
          '<p class="card-summary">' + (e.summary || "") + "</p>" +
          '<span class="card-meta">' + [e.source, e.section].filter(Boolean).join(" &middot; ") +
          "</span></a>";
      });
    });
    root.innerHTML =
      '<p class="empty">Search is unavailable (' + reason + '). Full list below.</p>' + out;
  }

  if (!window.React || !window.ReactDOM || !window.htm) {
    renderFallback("could not load React");
    return;
  }

  /* ---------- the app ---------- */

  var html = htm.bind(React.createElement);
  var useState = React.useState;
  var useEffect = React.useEffect;
  var useMemo = React.useMemo;
  var useRef = React.useRef;

  // Wrap query matches in <mark> without using dangerouslySetInnerHTML.
  function highlight(text, terms) {
    if (!text) return null;
    if (!terms.length) return text;
    var pattern = terms
      .map(function (t) { return t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); })
      .filter(Boolean)
      .join("|");
    if (!pattern) return text;
    var parts = String(text).split(new RegExp("(" + pattern + ")", "ig"));
    return parts.map(function (part, i) {
      var hit = terms.some(function (t) { return part.toLowerCase() === t; });
      return hit ? html`<mark key=${i}>${part}</mark>` : part;
    });
  }

  function Card(props) {
    var e = props.entry;
    var terms = props.terms;
    var ahead = e.status === "ahead-of-sequence";
    var meta = [e.source, e.section].filter(Boolean).join(" · ");
    return html`
      <a class="card" href=${e.path}>
        <span class="card-top">
          <span class="card-title">${highlight(e.title, terms)}</span>
          <span class="badge">${e.type}</span>
          ${ahead && html`<span class="badge warn" title="Covers a section the lesson sequence has not reached">ahead of sequence</span>`}
        </span>
        <p class="card-summary">${highlight(e.summary, terms)}</p>
        <span class="card-meta">${meta}</span>
      </a>`;
  }

  function App() {
    var q = useState("");
    var query = q[0], setQuery = q[1];
    var t = useState("all");
    var type = t[0], setType = t[1];
    var inputRef = useRef(null);

    // "/" focuses search, Escape clears it.
    useEffect(function () {
      function onKey(ev) {
        if (ev.key === "/" && document.activeElement !== inputRef.current) {
          ev.preventDefault();
          inputRef.current && inputRef.current.focus();
        } else if (ev.key === "Escape" && document.activeElement === inputRef.current) {
          setQuery("");
        }
      }
      document.addEventListener("keydown", onKey);
      return function () { document.removeEventListener("keydown", onKey); };
    }, []);

    var results = useMemo(function () {
      return window.filterEntries(entries, query, type);
    }, [query, type]);

    var groups = useMemo(function () {
      return window.groupBySubject(results);
    }, [results]);

    var terms = query.toLowerCase().split(/\s+/).filter(Boolean);

    var chips = [
      { id: "all", label: "All" },
      { id: "lesson", label: "Lessons" },
      { id: "reference", label: "Reference" },
    ];

    return html`
      <div>
        <div class="controls">
          <input
            ref=${inputRef}
            class="search"
            type="search"
            placeholder="Search titles, sections, tags…"
            value=${query}
            aria-label="Search lessons and reference cards"
            onInput=${function (ev) { setQuery(ev.target.value); }} />
          <div class="chips">
            ${chips.map(function (c) {
              return html`
                <button
                  key=${c.id}
                  class="chip"
                  aria-pressed=${type === c.id}
                  onClick=${function () { setType(c.id); }}>${c.label}</button>`;
            })}
            <span class="count">${results.length} of ${entries.length}</span>
          </div>
        </div>

        ${results.length === 0
          ? html`<div class="empty">Nothing matches <strong>${query}</strong>.</div>`
          : groups.map(function (g) {
              return html`
                <section key=${g.subject}>
                  <p class="subject">${g.subject}</p>
                  ${g.items.map(function (e) {
                    return html`<${Card} key=${e.path} entry=${e} terms=${terms} />`;
                  })}
                </section>`;
            })}
      </div>`;
  }

  try {
    ReactDOM.createRoot(root).render(html`<${App} />`);
  } catch (err) {
    renderFallback("render error");
  }
})();
</script>

</body>
</html>
